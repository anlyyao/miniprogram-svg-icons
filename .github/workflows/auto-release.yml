name: Auto Release

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  ALL_PACKAGES: "wechat alipay kuaishou douyin baidu jd xiaohongshu utils"

jobs:
  preview:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' && startsWith(github.head_ref, 'release/')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect packages
        id: detect
        run: |
          PACKAGES_INFO=""
          TO_PUBLISH=""
          TO_BUILD=""

          git fetch origin develop --quiet

          for PKG in $ALL_PACKAGES; do
            PKG_PATH="packages/$PKG/package.json"
            PKG_NAME="@mp-svg-icons/$PKG"

            [ ! -f "$PKG_PATH" ] && continue

            RELEASE_VERSION=$(node -p "require('./$PKG_PATH').version")
            DEVELOP_VERSION=$(git show origin/develop:$PKG_PATH 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version" 2>/dev/null || echo "")

            VERSION_CHANGED=false
            if [ -z "$DEVELOP_VERSION" ]; then
              VERSION_CHANGED=true
              CHANGE_REASON="new package"
            elif [ "$RELEASE_VERSION" != "$DEVELOP_VERSION" ]; then
              VERSION_CHANGED=true
              CHANGE_REASON="from $DEVELOP_VERSION"
            fi

            if [ "$VERSION_CHANGED" = true ]; then
              # Check if version already exists on npm
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/$PKG_NAME/$RELEASE_VERSION")

              if [ "$HTTP_STATUS" = "200" ]; then
                PACKAGES_INFO="$PACKAGES_INFO\n- \`$PKG_NAME@$RELEASE_VERSION\` ⚠️ version exists on npm ($CHANGE_REASON)"
              else
                PACKAGES_INFO="$PACKAGES_INFO\n- \`$PKG_NAME@$RELEASE_VERSION\` ✅ will publish ($CHANGE_REASON)"
                TO_PUBLISH="$TO_PUBLISH $PKG_NAME@$RELEASE_VERSION"
                TO_BUILD="$TO_BUILD $PKG"
              fi
            else
              PACKAGES_INFO="$PACKAGES_INFO\n- \`$PKG_NAME@$RELEASE_VERSION\` ⏭️ no version change"
            fi
          done

          echo "packages_info<<EOF" >> $GITHUB_OUTPUT
          echo -e "$PACKAGES_INFO" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "to_publish=$(echo $TO_PUBLISH | xargs)" >> $GITHUB_OUTPUT
          echo "to_build=$(echo $TO_BUILD | xargs)" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          PACKAGES_INFO: ${{ steps.detect.outputs.packages_info }}
          TO_PUBLISH: ${{ steps.detect.outputs.to_publish }}
          TO_BUILD: ${{ steps.detect.outputs.to_build }}
        with:
          script: |
            const packagesInfo = process.env.PACKAGES_INFO;
            const toPublish = process.env.TO_PUBLISH;
            const toBuild = process.env.TO_BUILD;

            let note = '';
            if (toPublish) {
              note = '> ⚠️ Merging this PR will:\n> - 🔨 Build packages: `' + toBuild + '`\n> - 📤 Publish packages marked with ✅ to npm.';
            } else {
              note = '> ℹ️ No packages will be published (no version changes or versions already exist on npm).';
            }
            const body = '## 🚀 Release Preview\n\n### Package Status\n' + packagesInfo + '\n\n' + note;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Release Preview'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Detect packages
        id: detect
        run: |
          TO_PUBLISH=""
          PREV_DEVELOP=$(git rev-parse HEAD^1 2>/dev/null || echo "")

          for PKG in $ALL_PACKAGES; do
            PKG_PATH="packages/$PKG/package.json"
            [ ! -f "$PKG_PATH" ] && continue

            CURRENT_VERSION=$(node -p "require('./$PKG_PATH').version")
            PREV_VERSION=""
            [ -n "$PREV_DEVELOP" ] && PREV_VERSION=$(git show $PREV_DEVELOP:$PKG_PATH 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version" 2>/dev/null || echo "")

            if [ -z "$PREV_VERSION" ] || [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
              TO_PUBLISH="$TO_PUBLISH $PKG"
            fi
          done

          echo "to_publish=$(echo $TO_PUBLISH | xargs)" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        if: steps.detect.outputs.to_publish != ''
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.detect.outputs.to_publish != ''
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # npm Trusted Publishing requires npm >= 11.5.1
      # Use corepack-free approach to avoid MODULE_NOT_FOUND errors on Node 22.x
      - name: Upgrade npm for Trusted Publishing
        if: steps.detect.outputs.to_publish != ''
        run: |
          npm cache clean --force || true
          npm install -g npm@11 --force

      - name: Install dependencies
        if: steps.detect.outputs.to_publish != ''
        run: pnpm install

      - name: Build changed packages only
        if: steps.detect.outputs.to_publish != ''
        run: |
          TO_PUBLISH="${{ steps.detect.outputs.to_publish }}"
          echo "📦 Building changed packages: $TO_PUBLISH"

          for PKG in $TO_PUBLISH; do
            echo "🔨 Building $PKG..."
            pnpm run build:$PKG
          done

      - name: Check npm availability & Publish
        id: publish
        if: steps.detect.outputs.to_publish != ''
        run: |
          TO_PUBLISH="${{ steps.detect.outputs.to_publish }}"
          PUBLISHED=""
          FAILED=""
          SKIPPED=""

          for PKG in $TO_PUBLISH; do
            PKG_PATH="packages/$PKG/package.json"
            DIST_PATH="dist/$PKG"
            PKG_NAME="@mp-svg-icons/$PKG"
            VERSION=$(node -p "require('./$PKG_PATH').version")

            # Check if version already exists on npm
            echo "🔍 Checking npm for $PKG_NAME@$VERSION..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/$PKG_NAME/$VERSION")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "⏭️ $PKG_NAME@$VERSION already exists on npm, skipping..."
              SKIPPED="$SKIPPED $PKG_NAME@$VERSION"
              continue
            fi

            # Determine dist-tag
            case "$VERSION" in
              *-beta*)  DIST_TAG="beta" ;;
              *-alpha*) DIST_TAG="alpha" ;;
              *-rc*)    DIST_TAG="rc" ;;
              *-next*)  DIST_TAG="next" ;;
              *-*)      DIST_TAG="next" ;;
              *)        DIST_TAG="latest" ;;
            esac

            if [ ! -d "$DIST_PATH" ]; then
              echo "❌ Dist path not found for $PKG_NAME"
              FAILED="$FAILED $PKG_NAME"
              continue
            fi

            cd "$DIST_PATH"
            echo "📤 Publishing $PKG_NAME@$VERSION with tag '$DIST_TAG'..."
            if npm publish --tag "$DIST_TAG" --access public --provenance; then
              echo "✅ Successfully published $PKG_NAME@$VERSION"
              PUBLISHED="$PUBLISHED $PKG_NAME@$VERSION"
            else
              echo "❌ Failed to publish $PKG_NAME@$VERSION"
              FAILED="$FAILED $PKG_NAME"
            fi
            cd - > /dev/null
          done

          echo "published=$(echo $PUBLISHED | xargs)" >> $GITHUB_OUTPUT
          echo "failed=$(echo $FAILED | xargs)" >> $GITHUB_OUTPUT
          echo "skipped=$(echo $SKIPPED | xargs)" >> $GITHUB_OUTPUT
          [ -n "$FAILED" ] && exit 1 || true

      - name: Create tags
        if: steps.publish.outputs.published != ''
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          for TAG in ${{ steps.publish.outputs.published }}; do
            git tag "$TAG"
          done
          git push origin --tags

      - name: Summary
        if: always()
        run: |
          PUBLISHED="${{ steps.publish.outputs.published }}"
          FAILED="${{ steps.publish.outputs.failed }}"
          SKIPPED="${{ steps.publish.outputs.skipped }}"

          if [ -z "${{ steps.detect.outputs.to_publish }}" ]; then
            echo "## ℹ️ No Packages to Publish" >> $GITHUB_STEP_SUMMARY
            echo "No version changes detected." >> $GITHUB_STEP_SUMMARY
          elif [ -n "$FAILED" ]; then
            echo "## ⚠️ Release Partially Failed" >> $GITHUB_STEP_SUMMARY
          elif [ -z "$PUBLISHED" ] && [ -n "$SKIPPED" ]; then
            echo "## ℹ️ All Packages Skipped" >> $GITHUB_STEP_SUMMARY
            echo "All versions already exist on npm." >> $GITHUB_STEP_SUMMARY
          else
            echo "## 🎉 Release Success" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$PUBLISHED" ]; then
            echo "### ✅ Published" >> $GITHUB_STEP_SUMMARY
            for PKG in $PUBLISHED; do echo "- \`$PKG\`" >> $GITHUB_STEP_SUMMARY; done
          fi

          if [ -n "$SKIPPED" ]; then
            echo "### ⏭️ Skipped (already on npm)" >> $GITHUB_STEP_SUMMARY
            for PKG in $SKIPPED; do echo "- \`$PKG\`" >> $GITHUB_STEP_SUMMARY; done
          fi

          if [ -n "$FAILED" ]; then
            echo "### ❌ Failed" >> $GITHUB_STEP_SUMMARY
            for PKG in $FAILED; do echo "- \`$PKG\`" >> $GITHUB_STEP_SUMMARY; done
          fi
