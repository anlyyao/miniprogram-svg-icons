name: pkg-pr-new
on:
  pull_request:
    branches: [develop]

jobs:
  build:
    if: ${{ github.repository == 'anlyyao/miniprogram-svg-icons' && !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: pnpm install

      - run: pnpm run generate

      - run: pnpm exec run-p build

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: pnpm dlx pkg-pr-new publish 'packages/wechat' 'packages/alipay' 'packages/kuaishou' 'packages/utils'
