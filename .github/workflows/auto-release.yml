name: Auto Release

on:
  pull_request:
    branches: [develop]
    types: [closed]

permissions:
  contents: write
  id-token: write

jobs:
  # ============================================================
  # PR 合并后打 tag 并发布 npm
  # 支持: miniprogram(所有小程序包) / 单个包发布
  # 版本类型: latest, beta, alpha, patch, rc, next 等
  # ============================================================
  release:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.head_ref, 'release/')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Parse release branch info
        id: parse
        uses: ./.github/actions/parse-release-branch

      - name: Verify package versions
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          FRAMEWORKS="${{ steps.parse.outputs.frameworks }}"

          MISMATCH="false"
          for FRAMEWORK in $FRAMEWORKS; do
            PKG_VERSION=$(node -p "require('./packages/$FRAMEWORK/package.json').version")

            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "❌ Version mismatch for @mp-svg-icons/$FRAMEWORK!"
              echo "   Expected: $VERSION"
              echo "   Found: $PKG_VERSION"
              MISMATCH="true"
            else
              echo "✅ @mp-svg-icons/$FRAMEWORK version verified: $VERSION"
            fi
          done

          if [ "$MISMATCH" = "true" ]; then
            echo ""
            echo "💡 Hint: Please check if the 'Auto Release Pre' workflow ran successfully on this PR."
            echo "   The pre-release workflow should have updated the package.json versions automatically."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          FRAMEWORKS="${{ steps.parse.outputs.frameworks }}"
          DIST_TAG="${{ steps.parse.outputs.dist_tag }}"
          VERSION="${{ steps.parse.outputs.version }}"

          PUBLISHED=""
          FAILED=""

          for FRAMEWORK in $FRAMEWORKS; do
            DIST_PATH="dist/$FRAMEWORK"

            if [ ! -d "$DIST_PATH" ]; then
              echo "❌ Build output not found: $DIST_PATH"
              FAILED="$FAILED @mp-svg-icons/$FRAMEWORK(missing-dist)"
              continue
            fi

            echo "📤 Publishing @mp-svg-icons/$FRAMEWORK@$VERSION with tag $DIST_TAG..."
            cd "$DIST_PATH"

            if npm publish --tag "$DIST_TAG" --access public --provenance; then
              echo "✅ Published @mp-svg-icons/$FRAMEWORK@$VERSION"
              PUBLISHED="$PUBLISHED @mp-svg-icons/$FRAMEWORK"
            else
              echo "❌ Failed to publish @mp-svg-icons/$FRAMEWORK"
              FAILED="$FAILED @mp-svg-icons/$FRAMEWORK"
            fi

            cd -
          done

          echo "published=$PUBLISHED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

          if [ -n "$FAILED" ]; then
            echo ""
            echo "⚠️ Some packages failed to publish:$FAILED"
            echo "✅ Successfully published:$PUBLISHED"
            exit 1
          fi

      - name: Create and push tag
        run: |
          TAG_NAME="${{ steps.parse.outputs.tag_name }}"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

          echo "🏷️ Pushed tag: $TAG_NAME"

      - name: Release summary
        if: always()
        run: |
          NAME="${{ steps.parse.outputs.name }}"
          VERSION="${{ steps.parse.outputs.version }}"
          DIST_TAG="${{ steps.parse.outputs.dist_tag }}"
          TAG_NAME="${{ steps.parse.outputs.tag_name }}"
          FRAMEWORKS="${{ steps.parse.outputs.frameworks }}"
          PUBLISHED="${{ steps.publish.outputs.published }}"
          FAILED="${{ steps.publish.outputs.failed }}"

          if [ -n "$FAILED" ]; then
            echo "## ⚠️ Release Partially Failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## 🎉 Release Published Successfully!" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| ---- | ----- |" >> $GITHUB_STEP_SUMMARY

          if [ "$NAME" = "miniprogram" ]; then
            echo "| 📦 Scope | All miniprogram packages |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📦 Scope | \`@mp-svg-icons/$NAME\` |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "| 📌 Version | \`$VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ Git Tag | \`$TAG_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ npm Tag | \`$DIST_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -n "$PUBLISHED" ]; then
            echo "### ✅ Published Packages" >> $GITHUB_STEP_SUMMARY
            for PKG in $PUBLISHED; do
              echo "- $PKG@$VERSION — [npm](https://www.npmjs.com/package/$PKG/v/$VERSION)" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$FAILED" ]; then
            echo "### ❌ Failed Packages" >> $GITHUB_STEP_SUMMARY
            for PKG in $FAILED; do
              echo "- $PKG" >> $GITHUB_STEP_SUMMARY
            done
          fi
