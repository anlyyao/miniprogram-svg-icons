name: Auto Release

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  ALL_PACKAGES: "wechat alipay kuaishou douyin baidu jd xiaohongshu utils"

jobs:
  preview:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' && startsWith(github.head_ref, 'release/')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Detect packages
        id: detect
        run: |
          PACKAGES_INFO=""
          TO_PUBLISH=""
          TO_BUILD=""

          git fetch origin develop --quiet

          for PKG in $ALL_PACKAGES; do
            PKG_PATH="packages/$PKG/package.json"
            PKG_NAME="@mp-svg-icons/$PKG"

            [ ! -f "$PKG_PATH" ] && continue

            RELEASE_VERSION=$(node -p "require('./$PKG_PATH').version")
            DEVELOP_VERSION=$(git show origin/develop:$PKG_PATH 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version" 2>/dev/null || echo "")

            VERSION_CHANGED=false
            if [ -z "$DEVELOP_VERSION" ]; then
              VERSION_CHANGED=true
              CHANGE_REASON="new package"
            elif [ "$RELEASE_VERSION" != "$DEVELOP_VERSION" ]; then
              VERSION_CHANGED=true
              CHANGE_REASON="from $DEVELOP_VERSION"
            fi

            if [ "$VERSION_CHANGED" = true ]; then
              # Check if version already exists on npm
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/$PKG_NAME/$RELEASE_VERSION")

              if [ "$HTTP_STATUS" = "200" ]; then
                PACKAGES_INFO="$PACKAGES_INFO\n- \`$PKG_NAME@$RELEASE_VERSION\` ⚠️ version exists on npm ($CHANGE_REASON)"
              else
                PACKAGES_INFO="$PACKAGES_INFO\n- \`$PKG_NAME@$RELEASE_VERSION\` ✅ will publish ($CHANGE_REASON)"
                TO_PUBLISH="$TO_PUBLISH $PKG_NAME@$RELEASE_VERSION"
                TO_BUILD="$TO_BUILD $PKG"
              fi
            else
              PACKAGES_INFO="$PACKAGES_INFO\n- \`$PKG_NAME@$RELEASE_VERSION\` ⏭️ no version change"
            fi
          done

          echo "packages_info<<EOF" >> $GITHUB_OUTPUT
          echo -e "$PACKAGES_INFO" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "to_publish=$(echo $TO_PUBLISH | xargs)" >> $GITHUB_OUTPUT
          echo "to_build=$(echo $TO_BUILD | xargs)" >> $GITHUB_OUTPUT

      - name: Collect changelog
        id: changelog
        uses: actions/github-script@v7
        env:
          TO_BUILD: ${{ steps.detect.outputs.to_build }}
        with:
          script: |
            const { renderPreview } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-changelog.cjs`);
            const dirs = (process.env.TO_BUILD || '').split(' ').filter(Boolean);
            // 直接读取各子包 .changelog/pr-*.md 暂存文件聚合预览
            core.setOutput('body', renderPreview({ dirs }));

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          PACKAGES_INFO: ${{ steps.detect.outputs.packages_info }}
          TO_PUBLISH: ${{ steps.detect.outputs.to_publish }}
          TO_BUILD: ${{ steps.detect.outputs.to_build }}
          CHANGELOG_BODY: ${{ steps.changelog.outputs.body }}
        with:
          script: |
            const packagesInfo = process.env.PACKAGES_INFO;
            const toPublish = process.env.TO_PUBLISH;
            const toBuild = process.env.TO_BUILD;
            const changelog = process.env.CHANGELOG_BODY;

            let note = '';
            if (toPublish) {
              note = '> ⚠️ Merging this PR will:\n> - 🔨 Build packages: `' + toBuild + '`\n> - 📤 Publish packages marked with ✅ to npm.\n> - 📝 Write `CHANGELOG.md` and create GitHub Releases.';
            } else {
              note = '> ℹ️ No packages will be published (no version changes or versions already exist on npm).';
            }
            const body = '## 🚀 Release Preview\n\n### Package Status\n' + packagesInfo + '\n\n'
              + (changelog ? changelog + '\n\n' : '')
              + note;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Release Preview'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Compose changelog into branch
        id: compose
        uses: actions/github-script@v7
        env:
          TO_BUILD: ${{ steps.detect.outputs.to_build }}
        with:
          script: |
            const { composeReleaseChangelog } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-changelog.cjs`);
            const dirs = (process.env.TO_BUILD || '').split(' ').filter(Boolean);
            // 读取各子包 .changelog/pr-*.md 暂存 → 合成 CHANGELOG.md → 清理暂存
            const { affected, removed } = composeReleaseChangelog({ dirs });
            core.setOutput('affected', affected.join(' '));
            core.setOutput('removed', removed.join(' '));

      - name: Commit changelog to release PR
        if: steps.compose.outputs.affected != ''
        env:
          AFFECTED: ${{ steps.compose.outputs.affected }}
          REMOVED: ${{ steps.compose.outputs.removed }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 合成后的 CHANGELOG.md（新增/修改）
          for PKG in $AFFECTED; do
            git add "packages/$PKG/CHANGELOG.md"
          done
          # 已被清理的 .changelog/pr-*.md 暂存文件（删除）
          for FILE in $REMOVED; do
            git add -A "$FILE"
          done
          if git diff --cached --quiet; then
            echo "ℹ️ 无变化，跳过提交"
          else
            git commit -m "docs(changelog): compose changelog & clear stash for release"
            git push origin HEAD:${{ github.head_ref }}
          fi

  release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.ACCESS_TOKEN }}
          fetch-tags: true

      - name: Detect packages
        id: detect
        run: |
          TO_PUBLISH=""
          PREV_DEVELOP=$(git rev-parse HEAD^1 2>/dev/null || echo "")

          for PKG in $ALL_PACKAGES; do
            PKG_PATH="packages/$PKG/package.json"
            [ ! -f "$PKG_PATH" ] && continue

            CURRENT_VERSION=$(node -p "require('./$PKG_PATH').version")
            PREV_VERSION=""
            [ -n "$PREV_DEVELOP" ] && PREV_VERSION=$(git show $PREV_DEVELOP:$PKG_PATH 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version" 2>/dev/null || echo "")

            if [ -z "$PREV_VERSION" ] || [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
              TO_PUBLISH="$TO_PUBLISH $PKG"
            fi
          done

          echo "to_publish=$(echo $TO_PUBLISH | xargs)" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Build changed packages only
        run: |
          TO_PUBLISH="${{ steps.detect.outputs.to_publish }}"
          echo "📦 Building changed packages: $TO_PUBLISH"

          for PKG in $TO_PUBLISH; do
            echo "🔨 Building $PKG..."
            pnpm run build:$PKG
          done

      - name: Check npm availability & Publish
        id: publish
        run: |
          TO_PUBLISH="${{ steps.detect.outputs.to_publish }}"
          PUBLISHED=""
          FAILED=""
          SKIPPED=""

          for PKG in $TO_PUBLISH; do
            PKG_PATH="packages/$PKG/package.json"
            DIST_PATH="dist/$PKG"
            PKG_NAME="@mp-svg-icons/$PKG"
            VERSION=$(node -p "require('./$PKG_PATH').version")

            # Check if version already exists on npm
            echo "🔍 Checking npm for $PKG_NAME@$VERSION..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/$PKG_NAME/$VERSION")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "⏭️ $PKG_NAME@$VERSION already exists on npm, skipping..."
              SKIPPED="$SKIPPED $PKG_NAME@$VERSION"
              continue
            fi

            # Determine dist-tag
            case "$VERSION" in
              *-beta*)  DIST_TAG="beta" ;;
              *-alpha*) DIST_TAG="alpha" ;;
              *-rc*)    DIST_TAG="rc" ;;
              *-next*)  DIST_TAG="next" ;;
              *-*)      DIST_TAG="next" ;;
              *)        DIST_TAG="latest" ;;
            esac

            if [ ! -d "$DIST_PATH" ]; then
              echo "❌ Dist path not found for $PKG_NAME"
              FAILED="$FAILED $PKG_NAME"
              continue
            fi

            cd "$DIST_PATH"
            echo "📤 Publishing $PKG_NAME@$VERSION with tag '$DIST_TAG'..."
            if npm publish --tag "$DIST_TAG" --access public --provenance; then
              echo "✅ Successfully published $PKG_NAME@$VERSION"
              PUBLISHED="$PUBLISHED $PKG_NAME@$VERSION"
            else
              echo "❌ Failed to publish $PKG_NAME@$VERSION"
              FAILED="$FAILED $PKG_NAME"
            fi
            cd - > /dev/null
          done

          echo "published=$(echo $PUBLISHED | xargs)" >> $GITHUB_OUTPUT
          echo "failed=$(echo $FAILED | xargs)" >> $GITHUB_OUTPUT
          echo "skipped=$(echo $SKIPPED | xargs)" >> $GITHUB_OUTPUT
          [ -n "$FAILED" ] && exit 1 || true

      - name: Update changelog
        id: changelog
        if: steps.publish.outputs.published != ''
        uses: actions/github-script@v7
        env:
          PUBLISHED: ${{ steps.publish.outputs.published }}
        with:
          script: |
            const { applyRelease } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-changelog.cjs`);
            const published = (process.env.PUBLISHED || '').split(' ').filter(Boolean);
            // CHANGELOG.md 已在 release PR 合成阶段写入，这里直接回读版本区块作为 Release 正文（兜底才会写文件）
            const releases = applyRelease({ published });
            core.setOutput('releases', JSON.stringify(releases));

      - name: Commit changelog
        if: steps.publish.outputs.published != ''
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️ CHANGELOG 已在 release PR 合成，无新增变化，跳过提交"
          else
            git commit -m "chore(changelog): update changelog [skip ci]"
            git push origin HEAD:develop
          fi

      - name: Create tags
        if: steps.publish.outputs.published != ''
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          for TAG in ${{ steps.publish.outputs.published }}; do
            git tag "$TAG"
          done
          git push origin --tags

      - name: Create GitHub releases
        id: releases
        if: steps.publish.outputs.published != ''
        uses: actions/github-script@v7
        env:
          RELEASES: ${{ steps.changelog.outputs.releases }}
        with:
          script: |
            const { createReleases } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-changelog.cjs`);
            const releases = JSON.parse(process.env.RELEASES || '[]');
            const urls = await createReleases({
              github,
              context,
              core,
              releases,
              prNumber: context.payload.pull_request.number,
            });
            core.setOutput('urls', urls.join(' '));

      - name: Summary
        if: always()
        run: |
          PUBLISHED="${{ steps.publish.outputs.published }}"
          FAILED="${{ steps.publish.outputs.failed }}"
          SKIPPED="${{ steps.publish.outputs.skipped }}"

          if [ -z "${{ steps.detect.outputs.to_publish }}" ]; then
            echo "## ℹ️ No Packages to Publish" >> $GITHUB_STEP_SUMMARY
            echo "No version changes detected." >> $GITHUB_STEP_SUMMARY
          elif [ -n "$FAILED" ]; then
            echo "## ⚠️ Release Partially Failed" >> $GITHUB_STEP_SUMMARY
          elif [ -z "$PUBLISHED" ] && [ -n "$SKIPPED" ]; then
            echo "## ℹ️ All Packages Skipped" >> $GITHUB_STEP_SUMMARY
            echo "All versions already exist on npm." >> $GITHUB_STEP_SUMMARY
          else
            echo "## 🎉 Release Success" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$PUBLISHED" ]; then
            echo "### ✅ Published" >> $GITHUB_STEP_SUMMARY
            for PKG in $PUBLISHED; do echo "- \`$PKG\`" >> $GITHUB_STEP_SUMMARY; done
          fi

          RELEASE_URLS="${{ steps.releases.outputs.urls }}"
          if [ -n "$RELEASE_URLS" ]; then
            echo "### 🏷️ GitHub Releases" >> $GITHUB_STEP_SUMMARY
            for URL in $RELEASE_URLS; do echo "- $URL" >> $GITHUB_STEP_SUMMARY; done
          fi

          if [ -n "$SKIPPED" ]; then
            echo "### ⏭️ Skipped (already on npm)" >> $GITHUB_STEP_SUMMARY
            for PKG in $SKIPPED; do echo "- \`$PKG\`" >> $GITHUB_STEP_SUMMARY; done
          fi

          if [ -n "$FAILED" ]; then
            echo "### ❌ Failed" >> $GITHUB_STEP_SUMMARY
            for PKG in $FAILED; do echo "- \`$PKG\`" >> $GITHUB_STEP_SUMMARY; done
          fi
